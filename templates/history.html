{% extends "base.html" %}

{% block title %}Transcription History{% endblock %}

{% block content %}
<div id="history-container" class="bg-white shadow-md rounded-lg p-8 w-full mx-auto transition-all duration-500 ease-in-out">
    <h1 class="text-2xl font-bold mb-6 text-center">Transcription History</h1>
    <ul id="history-list" class="space-y-4">
        <!-- History items will be appended here -->
    </ul>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/history')
        .then(response => response.json())
        .then(data => {
            const historyList = document.getElementById('history-list');
            if (data.history && data.history.length > 0) {
                data.history.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.className = 'bg-gray-50 p-4 border border-gray-200 rounded-lg';
                    listItem.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="font-bold text-gray-800">${item.url}</h4>
                            <span class="text-sm text-gray-600">${new Date(item.timestamp).toLocaleString()}</span>
                        </div>
                        <pre class="whitespace-pre-wrap w-full">${item.transcript}</pre>
                    `;
                    historyList.appendChild(listItem);
                });
            } else {
                historyList.innerHTML = '<p class="text-gray-600">No transcription history available.</p>';
            }
        })
        .catch(error => {
            console.error('Error fetching history:', error);
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '<p class="text-red-600">Error fetching history. Please try again later.</p>';
        });
});
</script>
{% endblock %}
